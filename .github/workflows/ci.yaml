name: CI

on:
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: backtest-frontend

# concurrency:
#   group: '${{ github.workflow }}-${{ github.ref }}'
#   cancel-in-progress: true

# permissions:
#   contents: read
#   packages: write
#   security-events: write
#   pull-requests: read

jobs:
  ci-sca:
    name: ci-sca
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          PNPM_VERSION=$(node -e "const p=require('./package.json').packageManager;console.log(p.split('@')[1])")
          npm install -g pnpm@${PNPM_VERSION}

      - name: Get pnpm store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: SCA — dependency vulnerability scan
        run: |
          set +e
          output=$(pnpm dlx audit-ci --high --output-format json 2>&1)
          exit_code=$?
          echo "$output"
          if [ $exit_code -ne 0 ]; then
            echo "::error::SCA found HIGH or CRITICAL vulnerabilities — details above"
            echo "$output" | python3 -c "
          import sys, json
          try:
            data = json.load(sys.stdin)
            advisories = data.get('advisories', {})
            for key, adv in advisories.items():
              sev = adv.get('severity','').upper()
              title = adv.get('title','')
              module = adv.get('module_name','')
              url = adv.get('url','')
              print(f'::error::[{sev}] {module} — {title} ({url})')
          except Exception:
            pass
          " || true
          fi
          exit $exit_code

  ci-format-lint:
    name: ci-format-lint
    needs: [ci-sca]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          PNPM_VERSION=$(node -e "const p=require('./package.json').packageManager;console.log(p.split('@')[1])")
          npm install -g pnpm@${PNPM_VERSION}

      - name: Get pnpm store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '>=1.6.0'

      - name: Formatting check (Prettier)
        run: |
          set +e
          files=$(pnpm prettier --list-different . 2>/dev/null)
          exit_code=$?
          if [ -n "$files" ]; then
            echo "::error::Prettier found formatting issues in $(echo "$files" | wc -l | tr -d ' ') file(s). Run 'pnpm prettier --write .' to fix."
            while IFS= read -r file; do
              echo "::group::$file"
              diff <(cat "$file") <(pnpm prettier --stdin-filepath "$file" < "$file" 2>/dev/null) || true
              echo "::endgroup::"
            done <<< "$files"
          fi
          exit $exit_code

      - name: Formatting check (OpenTofu HCL)
        run: tofu fmt -check -recursive deploy/gcp/terraform

      - name: Linting
        run: pnpm eslint . --format stylish

  ci-secrets-scan:
    name: ci-secrets-scan
    needs: [ci-format-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 \
            --repo gitleaks/gitleaks \
            --pattern 'gitleaks_8.30.1_linux_x64.tar.gz' \
            --pattern 'gitleaks_8.30.1_checksums.txt' \
            --dir /tmp
          CHECKSUM=$(grep 'linux_x64.tar.gz' /tmp/gitleaks_8.30.1_checksums.txt | awk '{print $1}')
          echo "${CHECKSUM}  /tmp/gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c
          tar -xz -C /usr/local/bin -f /tmp/gitleaks_8.30.1_linux_x64.tar.gz gitleaks

      - name: Secrets scan
        run: gitleaks detect --source . --exit-code 1

  ci-unit-tests:
    # Scope: isolated unit tests only (vitest --project server).
    # DO NOT add Playwright/E2E tests here — e2e-tests/ belongs to the
    # cd-smoke-tests CD gate (post-deploy, per constitution Rule 7).
    name: ci-unit-tests
    needs: [ci-secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          PNPM_VERSION=$(node -e "const p=require('./package.json').packageManager;console.log(p.split('@')[1])")
          npm install -g pnpm@${PNPM_VERSION}

      - name: Get pnpm store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm vitest run --project server --coverage --reporter=verbose

      - name: Log coverage report path
        if: always()
        run: echo "Coverage report written to coverage/"

  build-and-scan-image:
    name: build
    runs-on: ubuntu-latest
    needs: [ci-unit-tests]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate build tag
        id: tag
        run: echo "tag=build-$(date -u +'%Y%m%d%H%M')" >> "$GITHUB_OUTPUT"
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan image with Trivy (blocks on CRITICAL)
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --no-progress \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push image to GHCR
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
